x-journaux: &journaux
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  nginx:
    <<: *journaux
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
    networks: [interne]

  certbot:
    image: certbot/certbot
    profiles: ["outils"]          # ne démarre que sur demande
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_UTILISATEUR}
      POSTGRES_PASSWORD: ${DB_ADMIN_MOT_DE_PASSE}
      POSTGRES_DB: ${DB_NOM}
      DB_APP_MOT_DE_PASSE: ${DB_APP_MOT_DE_PASSE}
    volumes:
      - donnees_db:/var/lib/postgresql/data
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_UTILISATEUR} -d ${DB_NOM}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [interne]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Indian/Antananarivo
      DOSSIERS_DIR: /app/storage/dossiers
      NODE_ENV: production
      API_HOTE: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://colibris_app:${DB_APP_MOT_DE_PASSE}@db:5432/${DB_NOM}?schema=public
      DATABASE_URL_MIGRATION: postgresql://${DB_ADMIN_UTILISATEUR}:${DB_ADMIN_MOT_DE_PASSE}@db:5432/${DB_NOM}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      TOTP_CLE: ${TOTP_CLE}
    volumes:
      - donnees_fichiers:/app/storage
    networks: [interne]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    environment:
      BACKEND_URL: http://api:3001/api
      TZ: Indian/Antananarivo
    networks: [interne]
    
    

networks:
  interne:

volumes:
  donnees_db:
  donnees_fichiers:
  certbot_www:
  certbot_certs: