worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 12m;
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;

  # Limites PAR ADRESSE (la limite par session est dans l'API).
  # Les valeurs sont larges : tout l'établissement partage souvent une seule adresse.
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=connexion:10m rate=30r/m;
  limit_req_status 429;

  upstream web { server web:3000; }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # écrase tout en-tête falsifié par le client
    proxy_set_header X-Forwarded-Proto $scheme;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Connexion : la vraie protection contre le brute-force est le compteur par compte (7A)
    location /api/login {
      limit_req zone=connexion burst=20 nodelay;
      proxy_pass http://web;
    }

    location / {
      limit_req zone=general burst=100 nodelay;
      proxy_pass http://web;
    }
  }
}