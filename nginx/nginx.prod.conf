worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 12m;
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;

  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=connexion:10m rate=30r/m;
  limit_req_status 429;

  upstream web { server web:3000; }

  # Port 80 : renouvellement du certificat, tout le reste est redirigé vers HTTPS
  server {
    listen 80;
    server_name colibris.exemple.mg;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name colibris.exemple.mg;

    ssl_certificate     /etc/letsencrypt/live/colibris.exemple.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colibris.exemple.mg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Le navigateur refusera HTTP pour ce site. Durée courte au début (1 jour) : passez à 31536000 (1 an) une fois tout vérifié.
    add_header Strict-Transport-Security "max-age=86400" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/login {
      limit_req zone=connexion burst=20 nodelay;
      proxy_pass http://web;
    }

    location / {
      limit_req zone=general burst=100 nodelay;
      proxy_pass http://web;
    }
  }
}